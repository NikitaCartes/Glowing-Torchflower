mod_id = "glowing-torchflower"
mod_name = "Glowing Torchflower"
mod_version = "1.4.0"

hocon_version = "4.1.2"
commons_text_version = "1.10.0"
typesafe_config_version = "1.4.3"
geantyref_version = "1.3.13"
mixinextras_version = "0.5.4"

# Fabric — loader versions: https://fabricmc.net/develop/
# Minecraft is shipped deobfuscated from 26.1 on. Older nodes add Mojang mappings and
# publish the remapped jar, see build.fabric.gradle.kts.
[fabric."1.19.4"]
minecraft_version = "1.19.4"
loader_version = "0.19.3"
java_version = "17"
supported_minecraft_version = ">=1.19.4- <1.20"
display_name = "[1.19.4]"
supported_versions = "1.19.4"

# 1.20.3 dropped the FeatureFlag[] parameter from Blocks.flowerPot, but intermediary keeps
# the method as method_50000 either way, and the injection matches on name without a
# descriptor. One node therefore covers 1.20 to 1.21.1.
[fabric."1.20"]
minecraft_version = "1.20"
loader_version = "0.19.3"
java_version = "17"
supported_minecraft_version = ">=1.20- <1.21.2"
display_name = "[1.20 - 1.21.1]"
supported_versions = "1.20,1.20.1,1.20.2,1.20.3,1.20.4,1.20.5,1.20.6,1.21,1.21.1"

[fabric."1.21.2"]
minecraft_version = "1.21.2"
loader_version = "0.19.3"
java_version = "21"
supported_minecraft_version = ">=1.21.2- <26.1"
display_name = "[1.21.2 - 1.21.11]"
supported_versions = "1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11"

[fabric."26.1"]
minecraft_version = "26.1"
loader_version = "0.19.3"
java_version = "25"
supported_minecraft_version = ">=26.1- <26.2"
display_name = "[26.1]"
supported_versions = "26.1,26.1.1,26.1.2"

[fabric."26.2"]
minecraft_version = "26.2"
loader_version = "0.19.3"
java_version = "25"
supported_minecraft_version = ">=26.2-"
display_name = "[26.2+]"
supported_versions = "26.2"

# NeoForge — versions: https://projects.neoforged.net/neoforged/neoforge
# neoforge_version is the oldest build of the range: neoforge.mods.toml turns it into
# the open-ended dependency range "[<neoforge_version>,)".
[neoforge."1.21"]
minecraft_version = "1.21"
neoforge_version = "21.0.167"
java_version = "21"
supported_minecraft_version = "[1.21,1.21.2)"
display_name = "[1.21 - 1.21.1]"
supported_versions = "1.21,1.21.1"

[neoforge."1.21.2"]
minecraft_version = "1.21.2"
neoforge_version = "21.2.1-beta"
java_version = "21"
supported_minecraft_version = "[1.21.2,26.1)"
display_name = "[1.21.2 - 1.21.11]"
supported_versions = "1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11"

[neoforge."26.1"]
minecraft_version = "26.1"
neoforge_version = "26.1.0.19-beta"
java_version = "25"
supported_minecraft_version = "[26.1,26.2)"
display_name = "[26.1]"
